[project]
name = "second-thought"
version = "0.1.0"
description = "Local T5 text detoxification inference"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.3",
    "sentencepiece==0.2.1",
    "ipykernel>=6.29,<7",
]

[dependency-groups]
dev = ["nbformat>=5.10,<6"]

# Use CPU wheels on Linux/Windows; macOS uses its native PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

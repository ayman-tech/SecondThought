[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondthought"
version = "0.1.0"
description = "A configurable baseline for intent-preserving professional rewrites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3.0",
  "gradio>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
secondthought = "secondthought.cli:main"
secondthought-app = "secondthought.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
